name: Kaggle relief training

on:
  workflow_dispatch:
    inputs:
      action:
        description: "check · start · status · fetch"
        type: choice
        options: [check, start, status, fetch]
        default: check

permissions:
  contents: write

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "kaggle>=2.2"
      - run: python training/kaggle_ci.py ${{ inputs.action }}
        env:
          KAGGLE_CI_LOG: ${{ runner.temp }}/kaggle-status.txt
      # always: publish the messages on the small kaggle-status branch, so they can be read without logs
      - if: always()
        run: |
          f="$RUNNER_TEMP/kaggle-status.txt"; [ -f "$f" ] || echo "[error] no messages (step crashed early)" > "$f"
          d=$(mktemp -d); cd "$d"; git init -q; git checkout -q -b kaggle-status
          { echo "action: ${{ inputs.action }}  run: ${{ github.run_id }}  time: $(date -u +%FT%TZ)"; cat "$f"; } > status.txt
          git add status.txt
          git -c user.name="Claude (for abuzar310)" -c user.email="noreply@anthropic.com" commit -qm "kaggle status"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kaggle-status
      # fetch: put the results on a separate branch, never straight on main (the live site)
      - if: inputs.action == 'fetch'
        run: |
          git config user.name "Claude (for abuzar310)"
          git config user.email "noreply@anthropic.com"
          git checkout -B relief-model-results
          git add training/results public/models || true
          git commit -m "Relief model results from Kaggle" || echo "nothing to commit"
          git push -f origin relief-model-results
